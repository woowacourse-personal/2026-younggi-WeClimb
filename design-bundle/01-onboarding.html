<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1 · 온보딩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05070d;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px;font-family:'Barlow',system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.phone{width:390px;height:844px;background:radial-gradient(120% 60% at 50% 0%,#1a1005 0%,#0B0F1A 55%);border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.06)}
.sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600;color:#cbd5e1}
.cnd{font-family:'Barlow Condensed',sans-serif}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 32px;text-align:center}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:44px;font-weight:700;letter-spacing:1px}
.logo b{color:#EA580C}
.tag{color:#94A3B8;font-size:16px;line-height:1.5;margin-top:14px;max-width:260px}
.spacer{flex:0 0 40px}
.foot{padding:0 24px 40px;display:flex;flex-direction:column;gap:12px}
.btn{height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:16px;border:none;width:100%}
.google{background:#fff;color:#1a1a1a}
.gmark{width:20px;height:20px;border-radius:50%;background:conic-gradient(#EA4335 0 25%,#FBBC05 25% 50%,#34A853 50% 75%,#4285F4 75% 100%)}
.terms{color:#64748B;font-size:12px;line-height:1.5;margin-top:4px}
.mock{width:180px;height:180px;border-radius:36px;background:linear-gradient(160deg,#EA580C,#7c2d12);display:flex;align-items:center;justify-content:center;margin-bottom:8px;box-shadow:0 20px 50px rgba(234,88,12,.35)}
.mock svg{width:78px;height:78px}
</style></head>
<body><div class="phone">
  <div class="sb"><span class="cnd">9:41</span><span>▮▮▮ ᯤ 100</span></div>
  <div class="body">
    <div class="mock">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M8 6l1.2-2h5.6L16 6"/><circle cx="12" cy="12.5" r="3.4"/></svg>
    </div>
    <div class="logo">✦ WE-<b>CLIMB</b></div>
    <div class="tag">찍기만 하면, 정리는 앱이 한다.<br>클라이밍 전용 카메라</div>
  </div>
  <div class="foot">
    <button class="btn google"><span class="gmark"></span>Google로 계속하기</button>
    <div class="terms">계속하면 서비스 약관과 개인정보 처리방침에 동의하게 됩니다</div>
  </div>
</div></body></html>
