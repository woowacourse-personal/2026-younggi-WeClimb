<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1 · 온보딩 (벽 게이지)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05070d;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px;font-family:'Barlow',system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.phone{width:390px;height:844px;background:#0B0F1A;border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.06)}
.sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600;color:#cbd5e1}
.cnd{font-family:'Barlow Condensed',sans-serif}
.steps{display:flex;gap:6px;padding:4px 24px 0}
.steps i{height:4px;flex:1;border-radius:2px;background:#1E2634}
.steps i.on{background:#EA580C}
.body{flex:1;padding:18px 24px 0;display:flex;flex-direction:column;align-items:center}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:#94A3B8;letter-spacing:.5px;align-self:flex-start}
.logo b{color:#EA580C}
h1{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;margin:10px 0 4px;line-height:1.1;align-self:flex-start}
.desc{color:#94A3B8;font-size:13px;line-height:1.5;margin-bottom:14px;align-self:flex-start}
/* climbing-wall gauge */
.gaugewrap{display:flex;align-items:stretch;gap:14px;margin-top:6px}
.side{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:4px 0;color:#64748B;font-size:12px;font-weight:700}
.side .hard{color:#cbd5e1}
.wall{position:relative;width:132px;height:452px;border-radius:22px;overflow:hidden;background:#0e1420;border:1px solid rgba(255,255,255,.1)}
.base{position:absolute;inset:0;background:linear-gradient(to top,#EF4444,#F97316,#FACC15,#22C55E,#3B82F6,#4338CA,#9333EA,#92400E,#0B1220);opacity:.13}
.holds{position:absolute;inset:0}
.holds i{position:absolute;width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.14);box-shadow:inset 0 -2px 3px rgba(0,0,0,.3)}
.fill{position:absolute;left:0;right:0;bottom:0;height:54%;overflow:hidden}
.fill .g{position:absolute;left:0;right:0;bottom:0;height:452px;background:linear-gradient(to top,#EF4444,#F97316,#FACC15,#22C55E,#3B82F6,#4338CA,#9333EA,#92400E,#0B1220)}
.handle{position:absolute;left:-7px;right:-7px;bottom:54%;transform:translateY(50%);height:30px;display:flex;align-items:center;justify-content:center}
.handle .bar{width:100%;height:6px;border-radius:4px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.handle .grip{position:absolute;width:34px;height:22px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;gap:2px}
.handle .grip span{width:2px;height:9px;border-radius:2px;background:#94A3B8}
.hint{color:#64748B;font-size:12px;font-weight:600;margin-top:14px;text-align:center}
.foot{padding:10px 24px 34px}
.skip{text-align:center;color:#64748B;font-size:13px;font-weight:600;margin-bottom:12px}
.btn{height:54px;border-radius:16px;background:#EA580C;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;border:none;width:100%}
</style></head>
<body><div class="phone">
  <div class="sb"><span class="cnd">9:41</span><span>▮▮▮ ᯤ 100</span></div>
  <div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i></div>
  <div class="body">
    <div class="logo">✦ WE-<b>CLIMB</b> · 시작하기</div>
    <h1>평소 어디까지 푸세요?</h1>
    <div class="desc">벽을 위아래로 드래그해서 평소 완등하는 높이에 맞춰주세요.</div>
    <div class="gaugewrap">
      <div class="side"><span class="hard">어려움</span><span>쉬움</span></div>
      <div class="wall">
        <div class="base"></div>
        <div class="holds">
          <i style="left:22px;top:40px"></i><i style="left:88px;top:70px"></i>
          <i style="left:52px;top:120px"></i><i style="left:20px;top:170px"></i>
          <i style="left:96px;top:150px"></i><i style="left:60px;top:210px"></i>
          <i style="left:30px;top:250px"></i><i style="left:92px;top:270px"></i>
          <i style="left:54px;top:320px"></i><i style="left:24px;top:360px"></i>
          <i style="left:94px;top:380px"></i><i style="left:60px;top:420px"></i>
        </div>
        <div class="fill"><div class="g"></div></div>
        <div class="handle"><div class="bar"></div><div class="grip"><span></span><span></span><span></span></div></div>
      </div>
    </div>
    <div class="hint">기록이 쌓이면 자동으로 더 정확해져요</div>
  </div>
  <div class="foot">
    <div class="skip">잘 모르겠어요 — 건너뛰기</div>
    <button class="btn">시작하기</button>
  </div>
</div></body></html>
