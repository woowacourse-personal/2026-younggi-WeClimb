<!-- @dsCard group="Screens" -->
<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1 · 온보딩 (오버행 벽 게이지)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05070d;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px;font-family:'Barlow',system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.phone{width:390px;height:844px;background:#0B0F1A;border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.06)}
.sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600;color:#cbd5e1}
.cnd{font-family:'Barlow Condensed',sans-serif}
.steps{display:flex;gap:6px;padding:4px 24px 0}
.steps i{height:4px;flex:1;border-radius:2px;background:#1E2634}
.steps i.on{background:#EA580C}
.body{flex:1;padding:18px 24px 0;display:flex;flex-direction:column;align-items:center}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:#94A3B8;letter-spacing:.5px;align-self:flex-start}
.logo b{color:#EA580C}
h1{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;margin:10px 0 4px;line-height:1.1;align-self:flex-start}
.desc{color:#94A3B8;font-size:13px;line-height:1.5;margin-bottom:10px;align-self:flex-start}
.gaugewrap{display:flex;align-items:stretch;gap:12px;margin-top:2px}
.side{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:6px 0;color:#64748B;font-size:12px;font-weight:700}
.side .hard{color:#cbd5e1}
.hint{color:#64748B;font-size:12px;font-weight:600;margin-top:12px;text-align:center}
.foot{padding:8px 24px 34px}
.skip{text-align:center;color:#64748B;font-size:13px;font-weight:600;margin-bottom:12px}
.btn{height:54px;border-radius:16px;background:#EA580C;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;border:none;width:100%}
</style></head>
<body><div class="phone">
  <div class="sb"><span class="cnd">9:41</span><span>▮▮▮ ᯤ 100</span></div>
  <div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i></div>
  <div class="body">
    <div class="logo">✦ WE-<b>CLIMB</b> · 시작하기</div>
    <h1>평소 어디까지 푸세요?</h1>
    <div class="desc">벽을 드래그해서 평소 완등하는 높이에 맞춰주세요.</div>
    <div class="gaugewrap">
      <div class="side"><span class="hard">어려움</span><span>쉬움</span></div>
      <svg width="176" height="470" viewBox="0 0 176 470">
        <defs>
          <linearGradient id="grad" x1="0" y1="470" x2="0" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#EF4444"/><stop offset="0.12" stop-color="#FB923C"/>
            <stop offset="0.25" stop-color="#FACC15"/><stop offset="0.38" stop-color="#22C55E"/>
            <stop offset="0.52" stop-color="#3B82F6"/><stop offset="0.66" stop-color="#6366F1"/>
            <stop offset="0.80" stop-color="#A855F7"/><stop offset="0.90" stop-color="#B57C4A"/>
            <stop offset="1" stop-color="#1E293B"/>
          </linearGradient>
          <clipPath id="wall">
            <polygon points="40,22 150,22 40,448"/>
          </clipPath>
        </defs>
        <g clip-path="url(#wall)">
          <rect x="0" y="0" width="176" height="470" fill="url(#grad)" opacity="0.16"/>
          <!-- climbed fill from bottom apex up to handle y=235 (~50%) -->
          <rect x="0" y="235" width="176" height="235" fill="url(#grad)"/>
          <!-- holds along the overhanging face -->
          <circle cx="46" cy="410" r="6" fill="rgba(255,255,255,.2)"/>
          <circle cx="58" cy="350" r="5" fill="rgba(255,255,255,.18)"/>
          <circle cx="70" cy="290" r="6" fill="rgba(255,255,255,.2)"/>
          <circle cx="82" cy="235" r="5" fill="rgba(0,0,0,.18)"/>
          <circle cx="96" cy="175" r="6" fill="rgba(0,0,0,.2)"/>
          <circle cx="110" cy="115" r="5" fill="rgba(0,0,0,.2)"/>
          <circle cx="122" cy="66" r="5" fill="rgba(0,0,0,.22)"/>
        </g>
        <polygon points="40,22 150,22 40,448" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="1.5"/>
        <!-- handle at the climbed height -->
        <g>
          <rect x="34" y="231" width="70" height="8" rx="4" fill="#fff"/>
          <rect x="52" y="225" width="22" height="20" rx="6" fill="#fff"/>
          <rect x="58" y="231" width="2" height="8" rx="1" fill="#94A3B8"/><rect x="62" y="231" width="2" height="8" rx="1" fill="#94A3B8"/><rect x="66" y="231" width="2" height="8" rx="1" fill="#94A3B8"/>
        </g>
      </svg>
    </div>
    <div class="hint">기록이 쌓이면 자동으로 더 정확해져요</div>
  </div>
  <div class="foot">
    <div class="skip">잘 모르겠어요 — 건너뛰기</div>
    <button class="btn">시작하기</button>
  </div>
</div></body></html>
