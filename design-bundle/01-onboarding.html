<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1 · 온보딩 (자기평가)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05070d;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px;font-family:'Barlow',system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.phone{width:390px;height:844px;background:#0B0F1A;border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.06)}
.sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600;color:#cbd5e1}
.cnd{font-family:'Barlow Condensed',sans-serif}
.steps{display:flex;gap:6px;padding:4px 24px 0}
.steps i{height:4px;flex:1;border-radius:2px;background:#1E2634}
.steps i.on{background:#EA580C}
.body{flex:1;padding:18px 24px 0;overflow-y:auto}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:#94A3B8;letter-spacing:.5px}
.logo b{color:#EA580C}
h1{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;margin:10px 0 4px;line-height:1.1}
.desc{color:#94A3B8;font-size:13px;line-height:1.5;margin-bottom:14px}
.scale{display:flex;flex-direction:column;gap:5px}
.opt{display:flex;align-items:center;gap:12px;background:#141A26;border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:9px 12px;min-height:44px}
.opt.sel{border-color:#EA580C;background:linear-gradient(120deg,#20140b,#141a26)}
.sq{width:24px;height:24px;border-radius:7px;flex:none}
.opt .t{font-weight:700;font-size:14px}
.opt .lv{margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:#64748B}
.opt.sel .lv{color:#EA580C}
.tag{margin-left:auto;font-size:10px;color:#64748B;font-weight:700}
.foot{padding:12px 24px 34px}
.skip{text-align:center;color:#64748B;font-size:13px;font-weight:600;margin-bottom:12px}
.btn{height:54px;border-radius:16px;background:#EA580C;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;border:none;width:100%}
</style></head>
<body><div class="phone">
  <div class="sb"><span class="cnd">9:41</span><span>▮▮▮ ᯤ 100</span></div>
  <div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i></div>
  <div class="body">
    <div class="logo">✦ WE-<b>CLIMB</b> · 시작하기</div>
    <h1>평소 어느 정도 푸세요?</h1>
    <div class="desc">평균적으로 완등하는 난이도를 골라주세요. 기록이 쌓이면 자동으로 맞춰드려요.</div>
    <div class="scale">
      <div class="opt"><span class="sq" style="background:#0B1220;border:1.5px solid #475569"></span><div class="t">검정</div><span class="lv">Lv.9 · 어려움</span></div>
      <div class="opt"><span class="sq" style="background:#92400E"></span><div class="t">갈색</div><span class="lv">Lv.8</span></div>
      <div class="opt"><span class="sq" style="background:#9333EA"></span><div class="t">보라</div><span class="lv">Lv.7</span></div>
      <div class="opt"><span class="sq" style="background:#4338CA"></span><div class="t">남색</div><span class="lv">Lv.6</span></div>
      <div class="opt sel"><span class="sq" style="background:#3B82F6"></span><div class="t">파랑</div><span class="lv">Lv.5</span></div>
      <div class="opt"><span class="sq" style="background:#22C55E"></span><div class="t">초록</div><span class="lv">Lv.4</span></div>
      <div class="opt"><span class="sq" style="background:#FACC15"></span><div class="t">노랑</div><span class="lv">Lv.3</span></div>
      <div class="opt"><span class="sq" style="background:#F97316"></span><div class="t">주황</div><span class="lv">Lv.2</span></div>
      <div class="opt"><span class="sq" style="background:#EF4444"></span><div class="t">빨강</div><span class="lv">Lv.1 · 쉬움</span></div>
    </div>
  </div>
  <div class="foot">
    <div class="skip">잘 모르겠어요 — 건너뛰기</div>
    <button class="btn">시작하기</button>
  </div>
</div></body></html>
