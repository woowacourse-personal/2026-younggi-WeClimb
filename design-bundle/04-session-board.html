<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4 · 세션 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05070d;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px;font-family:'Barlow',system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.phone{width:390px;height:844px;background:#0B0F1A;border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.06)}
.sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600;color:#cbd5e1}
.cnd{font-family:'Barlow Condensed',sans-serif}
.top{text-align:center;padding:8px 0 2px}
.gym{font-size:14px;color:#94A3B8;font-weight:600}
.timer{font-family:'Barlow Condensed',sans-serif;font-size:42px;font-weight:700;letter-spacing:2px;line-height:1}
.rec{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#EA580C;font-weight:700;margin-top:1px}
.rec .d{width:7px;height:7px;border-radius:50%;background:#EA580C}
.body{flex:1;padding:8px 20px 0;display:flex;flex-direction:column;overflow-y:auto}
.hd{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 12px}
.hd .l{font-size:13px;color:#cbd5e1;font-weight:600}
.hd .r{font-size:11px;color:#64748B;font-weight:700}
.blvl{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,#1c2434,#141a26);border:1px solid rgba(255,255,255,.11);border-radius:16px;padding:13px 16px;margin-bottom:13px;box-shadow:0 4px 0 rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.07)}
.sw{width:30px;height:30px;border-radius:9px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.25) inset,0 1px 2px rgba(0,0,0,.3)}
.track{flex:1;height:22px;border-radius:8px;background:#0d111a;position:relative;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.fill{position:absolute;left:0;top:0;bottom:0}
.over{position:absolute;left:0;top:0;bottom:0}
.cnt{width:32px;text-align:right;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700}
.cam{height:60px;border-radius:18px;background:#EA580C;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:17px;margin:6px 0 0;box-shadow:0 12px 30px rgba(234,88,12,.32)}
.cam svg{width:24px;height:24px}
.foot{flex:none;padding:12px 20px 22px;display:flex;align-items:center;gap:12px;border-top:1px solid rgba(255,255,255,.08)}
.sum{flex:1;font-size:13px;color:#94A3B8;font-weight:600}
.sum b{color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:18px}
.end{padding:12px 18px;border-radius:14px;background:#1E2634;font-weight:700;font-size:14px;position:relative}
.badge{position:absolute;top:-8px;right:-6px;background:#EA580C;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
</style></head>
<body><div class="phone">
  <div class="sb"><span class="cnd">9:41</span><span>▮▮▮ ᯤ 100</span></div>
  <div class="top">
    <div class="gym">닻 클라이밍</div>
    <div class="timer">01:12:44</div>
    <div class="rec"><span class="d"></span>클라이밍 중</div>
  </div>
  <div class="body">
    <div class="hd"><span class="l">색을 탭해서 완등</span><span class="r">어려움 ↑</span></div>

    <div class="blvl">
      <span class="sw" style="background:#E45D5D"></span>
      <div class="track"></div>
      <div class="cnt" style="color:#334155">0</div>    </div>

    <div class="blvl">
      <span class="sw" style="background:#5A8FDB"></span>
      <div class="track"><div class="fill" style="width:100%;background:#5A8FDB"></div><div class="over" style="width:40%;background:#3E6CB5"></div></div>
      <div class="cnt">7</div>    </div>

    <div class="blvl">
      <span class="sw" style="background:#46AE72"></span>
      <div class="track"><div class="fill" style="width:100%;background:#2E7A52"></div><div class="over" style="width:40%;background:#20573A"></div></div>
      <div class="cnt">12</div>    </div>

    <div class="blvl">
      <span class="sw" style="background:#DDBB44"></span>
      <div class="track"><div class="fill" style="width:100%;background:#DDBB44"></div></div>
      <div class="cnt">5</div>    </div>

    <div class="blvl">
      <span class="sw" style="background:#E2E8F0"></span>
      <div class="track"><div class="fill" style="width:40%;background:#E2E8F0"></div></div>
      <div class="cnt">2</div>    </div>

    <div class="cam">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M8 6l1.2-2h5.6L16 6"/><circle cx="12" cy="12.5" r="3.4"/></svg>
      촬영하기
    </div>
  </div>
  <div class="foot">
    <div class="sum"><b>26</b> 완등 · 최고 <b>Lv.5</b></div>
    <div class="end">클라이밍 종료<span class="badge">트리밍 2</span></div>
  </div>
</div></body></html>
