<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4 · 세션 보드 (계단식)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05070d;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px;font-family:'Barlow',system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.phone{width:390px;height:844px;background:#0B0F1A;border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.06)}
.sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600;color:#cbd5e1}
.cnd{font-family:'Barlow Condensed',sans-serif}
.top{text-align:center;padding:8px 0 2px}
.gym{font-size:14px;color:#94A3B8;font-weight:600}
.timer{font-family:'Barlow Condensed',sans-serif;font-size:46px;font-weight:700;letter-spacing:2px;line-height:1}
.rec{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#EA580C;font-weight:700;margin-top:1px}
.rec .d{width:7px;height:7px;border-radius:50%;background:#EA580C}
.body{flex:1;padding:8px 20px 0;display:flex;flex-direction:column;overflow-y:auto}
.lbl{font-size:11px;color:#64748B;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin:6px 4px 8px;display:flex;justify-content:space-between}
.stairs{display:flex;flex-direction:column;gap:7px}
.step{display:flex;align-items:center;gap:12px;background:#141A26;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:9px 12px;min-height:48px}
.step .sq{width:26px;height:26px;border-radius:8px;flex:none}
.step .nm{font-weight:700;font-size:15px}
.step .lv{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:#64748B;font-weight:600}
.step .cnt{margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700}
.step .cnt.z{color:#334155}
/* staircase indent — 낮은 등급이 아래(왼쪽), 높은 등급이 위(오른쪽) */
.s1{margin-right:44%}.s2{margin-right:35%}.s3{margin-right:26%}
.s4{margin-right:17%}.s5{margin-right:8%}.s6{margin-right:0}
.cam{height:60px;border-radius:18px;background:#EA580C;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:17px;margin:14px 0 0;box-shadow:0 12px 30px rgba(234,88,12,.32)}
.cam svg{width:24px;height:24px}
.foot{flex:none;padding:12px 20px 22px;display:flex;align-items:center;gap:12px;border-top:1px solid rgba(255,255,255,.08)}
.sum{flex:1;font-size:13px;color:#94A3B8;font-weight:600}
.sum b{color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:18px}
.end{padding:12px 18px;border-radius:14px;background:#1E2634;font-weight:700;font-size:14px;position:relative}
.badge{position:absolute;top:-8px;right:-6px;background:#EA580C;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
</style></head>
<body><div class="phone">
  <div class="sb"><span class="cnd">9:41</span><span>▮▮▮ ᯤ 100</span></div>
  <div class="top">
    <div class="gym">닻 클라이밍</div>
    <div class="timer">01:12:44</div>
    <div class="rec"><span class="d"></span>클라이밍 중</div>
  </div>
  <div class="body">
    <div class="lbl"><span>이 암장 난이도 · 탭해서 완등</span><span>쉬움 → 어려움 ↗</span></div>
    <div class="stairs">
      <div class="step s6"><span class="sq" style="background:#A78BFA"></span><div><div class="nm">보라</div><div class="lv">Lv.6</div></div><span class="cnt z">0</span></div>
      <div class="step s5"><span class="sq" style="background:#F87171"></span><div><div class="nm">빨강</div><div class="lv">Lv.5</div></div><span class="cnt">2</span></div>
      <div class="step s4" style="border-color:rgba(96,165,250,.4)"><span class="sq" style="background:#60A5FA"></span><div><div class="nm">파랑</div><div class="lv">Lv.4</div></div><span class="cnt">4</span></div>
      <div class="step s3"><span class="sq" style="background:#22C55E"></span><div><div class="nm">초록</div><div class="lv">Lv.3</div></div><span class="cnt">5</span></div>
      <div class="step s2"><span class="sq" style="background:#FACC15"></span><div><div class="nm">노랑</div><div class="lv">Lv.2</div></div><span class="cnt">3</span></div>
      <div class="step s1"><span class="sq" style="background:#F1F5F9"></span><div><div class="nm">하양</div><div class="lv">Lv.1</div></div><span class="cnt z">0</span></div>
    </div>
    <div class="cam">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M8 6l1.2-2h5.6L16 6"/><circle cx="12" cy="12.5" r="3.4"/></svg>
      촬영하기
    </div>
  </div>
  <div class="foot">
    <div class="sum"><b>14</b> 완등 · 최고 <b>Lv.5</b></div>
    <div class="end">클라이밍 종료<span class="badge">트리밍 2</span></div>
  </div>
</div></body></html>
