<!-- @dsCard group="Screens" -->
<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3 · 암장 선택 (+ 색 비교)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05070d;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px;font-family:'Barlow',system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.phone{width:390px;height:844px;background:#0B0F1A;border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.06)}
.sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600;color:#cbd5e1}
.cnd{font-family:'Barlow Condensed',sans-serif}
.hd{display:flex;align-items:center;gap:14px;padding:6px 20px 10px}
.back{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.back svg{width:22px;height:22px}
.hd h1{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700}
.body{flex:1;overflow-y:auto;padding:0 20px}
.search{display:flex;align-items:center;gap:10px;background:#1E2634;border-radius:14px;padding:12px 16px;color:#94A3B8;font-size:14px;font-weight:500}
.search svg{width:17px;height:17px;flex:none}
.sect{font-size:11px;color:#64748B;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin:16px 4px 8px}
.pick{border:1px solid rgba(234,88,12,.5);background:linear-gradient(160deg,#20140b,#141a26);border-radius:16px;padding:14px}
.pick .top{display:flex;align-items:center;gap:12px}
.ic{width:38px;height:38px;border-radius:11px;background:rgba(234,88,12,.15);display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:19px;height:19px}
.pick .t{font-weight:700;font-size:16px}
.pick .s{font-size:12px;color:#94A3B8}
.pick .chk{margin-left:auto;color:#EA580C}
.pick .chk svg{width:22px;height:22px}
.adv{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
.ttl{font-size:11px;color:#64748B;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.advrow{display:flex;gap:8px}
.acard{flex:1;background:rgba(0,0,0,.25);border-radius:11px;padding:9px 11px}
.acard .k{font-size:11px;color:#94A3B8;font-weight:600}
.acard .val{display:flex;align-items:center;gap:6px;margin-top:5px;font-weight:700;font-size:13px}
.acard .sq{width:14px;height:14px;border-radius:4px}
/* level spectrum */
.cmp{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
.cmphd{font-size:11px;color:#64748B;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;padding:0 2px}
.specrow{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.specrow.app .cell{height:10px;border-radius:3px;opacity:.28}
.specrow.app .cell.cov{opacity:1}
.specrow.gym{margin-top:6px}
.specrow.gym .cell{height:24px;border-radius:6px;background:#161d2b;display:flex;align-items:center;justify-content:center}
.specrow.gym .cell .chip{width:16px;height:16px;border-radius:5px}
.lvnums{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin-top:5px}
.lvnums span{text-align:center;font-size:9px;color:#475569;font-family:'Barlow Condensed',sans-serif;font-weight:600}
.rowtag{display:flex;justify-content:space-between;font-size:10px;color:#475569;font-weight:700;margin:8px 2px 2px}
.item{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid rgba(255,255,255,.06)}
.item .ic2{width:38px;height:38px;border-radius:11px;background:#1E2634;display:flex;align-items:center;justify-content:center;flex:none}
.item .ic2 svg{width:18px;height:18px}
.item .t{font-weight:600;font-size:15px}
.item .s{font-size:12px;color:#64748B;margin-top:1px}
.add{display:flex;align-items:center;gap:10px;margin:12px 0;padding:12px 4px;color:#EA580C;font-weight:700;font-size:14px}
.add svg{width:19px;height:19px}
.foot{flex:none;padding:12px 20px 24px;border-top:1px solid rgba(255,255,255,.08)}
.go{height:56px;border-radius:16px;background:#EA580C;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:17px}
.go svg{width:22px;height:22px}
</style></head>
<body><div class="phone">
  <div class="sb"><span class="cnd">9:41</span><span>▮▮▮ ᯤ 100</span></div>
  <div class="hd">
    <div class="back"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></div>
    <h1>어디서 클라이밍해요?</h1>
  </div>
  <div class="body">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      암장 이름 검색
    </div>

    <div class="sect">선택됨</div>
    <div class="pick">
      <div class="top">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#EA580C" stroke-width="2"><path d="M12 21s-7-5.2-7-11a7 7 0 0114 0c0 5.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></div>
        <div><div class="t">닻 클라이밍</div><div class="s">서울 성동구 · 2.4km</div></div>
        <div class="chk"><svg viewBox="0 0 24 24" fill="none" stroke="#EA580C" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-5"/></svg></div>
      </div>
      <div class="adv">
        <div class="ttl">기록으로 보면, 여기선</div>
        <div class="advrow">
          <div class="acard"><div class="k">평균 완등</div><div class="val"><span class="sq" style="background:#22C55E"></span>초록 <span style="color:#94A3B8;font-weight:600">~파랑</span></div></div>
          <div class="acard"><div class="k">도전해볼 만</div><div class="val"><span class="sq" style="background:#EF4444"></span>빨강 <span style="color:#22C55E;font-weight:600">Lv.7</span></div></div>
        </div>
      </div>
      <div class="cmp">
        <div class="cmphd">전체 난이도 중 이 암장이 커버하는 구간</div>
        <div class="specrow app">
          <div class="cell cov" style="background:#EF4444"></div>
          <div class="cell" style="background:#F97316"></div>
          <div class="cell cov" style="background:#FACC15"></div>
          <div class="cell cov" style="background:#22C55E"></div>
          <div class="cell cov" style="background:#3B82F6"></div>
          <div class="cell" style="background:#4338CA"></div>
          <div class="cell cov" style="background:#9333EA"></div>
          <div class="cell" style="background:#92400E"></div>
          <div class="cell" style="background:#0B1220;border:1px solid #475569"></div>
        </div>
        <div class="specrow gym">
          <div class="cell"><span class="chip" style="background:#F1F5F9"></span></div>
          <div class="cell"></div>
          <div class="cell"><span class="chip" style="background:#FACC15"></span></div>
          <div class="cell"><span class="chip" style="background:#22C55E"></span></div>
          <div class="cell"><span class="chip" style="background:#3B82F6"></span></div>
          <div class="cell"></div>
          <div class="cell"><span class="chip" style="background:#EF4444"></span></div>
          <div class="cell"></div>
          <div class="cell"></div>
        </div>
        <div class="lvnums"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div>
        <div class="rowtag"><span>↑ 앱 레벨 (쉬움 → 어려움)</span><span>↑ 이 암장 색</span></div>
      </div>
    </div>

    <div class="sect">다른 암장</div>
    <div class="item">
      <div class="ic2"><svg viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2"><path d="M12 21s-7-5.2-7-11a7 7 0 0114 0c0 5.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></div>
      <div><div class="t">더클라임 양재점</div><div class="s">서울 서초구 · 6.1km</div></div>
    </div>

    <div class="add">
      <svg viewBox="0 0 24 24" fill="none" stroke="#EA580C" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      찾는 암장이 없어요 — 직접 추가
    </div>
  </div>
  <div class="foot">
    <div class="go">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M5 3l16 9-16 9V3z"/></svg>
      닻 클라이밍에서 시작
    </div>
  </div>
</div></body></html>
