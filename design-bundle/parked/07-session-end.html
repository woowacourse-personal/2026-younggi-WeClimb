<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7 · 클라이밍 종료 (일괄 정리)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05070d;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px;font-family:'Barlow',system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.phone{width:390px;height:844px;background:#0B0F1A;border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.06)}
.sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600;color:#cbd5e1}
.cnd{font-family:'Barlow Condensed',sans-serif}
.steps{display:flex;gap:6px;padding:8px 20px 4px}
.steps i{height:4px;flex:1;border-radius:2px;background:#1E2634}
.steps i.on{background:#EA580C}
.body{flex:1;overflow-y:auto;padding:10px 20px}
.title{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;margin:6px 0 2px}
.desc{color:#94A3B8;font-size:14px;margin-bottom:16px}
/* required photo */
.snap{height:150px;border-radius:18px;background:linear-gradient(160deg,#3a3330,#161a20);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.1)}
.snap .cta{display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:15px}
.snap .cta svg{width:30px;height:30px}
.req{position:absolute;top:10px;right:12px;font-size:10px;font-weight:700;color:#fff;background:#EA580C;padding:3px 8px;border-radius:8px}
.lbl{font-size:12px;color:#64748B;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin:22px 4px 10px;display:flex;justify-content:space-between}
.q{display:flex;align-items:center;gap:12px;background:#141A26;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px;margin-bottom:10px}
.thumb{width:52px;height:52px;border-radius:10px;background:linear-gradient(160deg,#3a3330,#161a20);flex:none;position:relative}
.thumb .sq{position:absolute;top:5px;left:5px;width:12px;height:12px;border-radius:4px}
.thumb .pl,.ft .pl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.thumb .pl svg,.ft .pl svg{width:16px;height:16px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.q .t{font-weight:600;font-size:14px}
.q .s{font-size:12px;color:#64748B}
.q .cut{margin-left:auto;font-size:13px;font-weight:700;padding:9px 14px;border-radius:11px;background:#EA580C;color:#fff}
.hint{font-size:11px;color:#64748B;margin:2px 4px 0}
/* failure default-delete + rescue */
.fail{background:rgba(220,38,38,.06);border:1px solid rgba(220,38,38,.22);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px}
.fail .ic{width:38px;height:38px;border-radius:11px;background:rgba(220,38,38,.14);display:flex;align-items:center;justify-content:center;flex:none}
.fail .ic svg{width:19px;height:19px}
.fail .t{font-weight:700;font-size:14px}
.fail .s{font-size:12px;color:#94A3B8;margin-top:2px}
.viewall{margin-left:auto;flex:none;display:flex;align-items:center;gap:3px;font-size:13px;font-weight:700;color:#cbd5e1;background:#1E2634;padding:9px 13px;border-radius:11px}
.viewall svg{width:14px;height:14px}
.foot{flex:none;padding:14px 20px 26px;border-top:1px solid rgba(255,255,255,.08)}
.next{height:56px;border-radius:16px;background:#EA580C;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:17px}
</style></head>
<body><div class="phone">
  <div class="sb"><span class="cnd">9:41</span><span>▮▮▮ ᯤ 100</span></div>
  <div class="steps"><i class="on"></i><i class="on"></i><i></i></div>
  <div class="body">
    <div class="title">정리만 하면 끝이에요</div>
    <div class="desc">오늘의 한 컷을 남기고, 영상만 빠르게 다듬어요.</div>

    <div class="snap">
      <span class="req">필수</span>
      <div class="cta">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M8 6l1.2-2h5.6L16 6"/><circle cx="12" cy="12.5" r="3.4"/></svg>
        오늘의 한 컷 찍기
      </div>
    </div>

    <div class="lbl"><span>미뤄둔 트리밍</span><span style="color:#EA580C">2개</span></div>
    <div class="q">
      <div class="thumb"><span class="sq" style="background:#5A8FDB"></span><span class="pl"><svg viewBox="0 0 24 24" fill="#fff"><path d="M7 4l13 8-13 8z"/></svg></span></div>
      <div><div class="t">파랑 · Lv.5</div><div class="s">0:19 · 4트 완등 · 재생</div></div>
      <span class="cut">자르기</span>
    </div>
    <div class="q">
      <div class="thumb"><span class="sq" style="background:#46AE72"></span><span class="pl"><svg viewBox="0 0 24 24" fill="#fff"><path d="M7 4l13 8-13 8z"/></svg></span></div>
      <div><div class="t">초록 · Lv.4</div><div class="s">0:24 · 첫 완등 · 재생</div></div>
      <span class="cut">자르기</span>
    </div>
    <div class="hint">썸네일을 탭하면 재생 · 자르지 않으면 원본 그대로 저장돼요.</div>

    <div class="lbl"><span>실패 영상</span><span>47개</span></div>
    <div class="fail">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#E45D5D" stroke-width="2"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></div>
      <div style="flex:1;min-width:0"><div class="t">실패 영상 47개</div><div class="s">모두 삭제 예정</div></div>
      <span class="viewall">전체 보기<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></span>
    </div>
  </div>
  <div class="foot">
    <div class="next">리포트 만들기</div>
  </div>
</div></body></html>
