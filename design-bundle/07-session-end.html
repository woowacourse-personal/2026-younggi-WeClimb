<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7 · 세션 종료 (일괄 정리)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05070d;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px;font-family:'Barlow',system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.phone{width:390px;height:844px;background:#0B0F1A;border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.06)}
.sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600;color:#cbd5e1}
.cnd{font-family:'Barlow Condensed',sans-serif}
.steps{display:flex;gap:6px;padding:8px 20px 4px}
.steps i{height:4px;flex:1;border-radius:2px;background:#1E2634}
.steps i.on{background:#EA580C}
.body{flex:1;overflow-y:auto;padding:10px 20px}
.title{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;margin:6px 0 2px}
.desc{color:#94A3B8;font-size:14px;margin-bottom:16px}
.snap{height:150px;border-radius:18px;background:linear-gradient(160deg,#334155,#0f172a);display:flex;align-items:center;justify-content:center;gap:10px;color:#cbd5e1;font-weight:600;border:1px dashed rgba(255,255,255,.18)}
.snap svg{width:26px;height:26px}
.lbl{font-size:12px;color:#64748B;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin:22px 4px 10px;display:flex;justify-content:space-between}
.q{display:flex;align-items:center;gap:12px;background:#141A26;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px;margin-bottom:10px}
.thumb{width:56px;height:56px;border-radius:10px;background:linear-gradient(160deg,#3a3330,#161a20);flex:none;position:relative}
.thumb .sq{position:absolute;top:5px;left:5px;width:12px;height:12px;border-radius:4px}
.q .t{font-weight:600;font-size:14px}
.q .s{font-size:12px;color:#64748B}
.q .acts{margin-left:auto;display:flex;gap:8px}
.q .acts span{font-size:12px;font-weight:700;padding:8px 11px;border-radius:10px}
.cut{background:#EA580C;color:#fff}
.orig{background:#1E2634;color:#94A3B8}
.trash{display:flex;align-items:center;gap:12px;background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.25);border-radius:14px;padding:14px;margin-top:8px}
.trash svg{width:20px;height:20px;flex:none}
.trash .t{font-weight:600;font-size:14px}
.trash .s{font-size:12px;color:#94A3B8}
.trash .go{margin-left:auto;font-size:12px;font-weight:700;color:#F87171;background:rgba(220,38,38,.15);padding:8px 12px;border-radius:10px}
.foot{flex:none;padding:14px 20px 26px;border-top:1px solid rgba(255,255,255,.08)}
.next{height:56px;border-radius:16px;background:#EA580C;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:17px}
</style></head>
<body><div class="phone">
  <div class="sb"><span class="cnd">9:41</span><span>▮▮▮ ᯤ 100</span></div>
  <div class="steps"><i class="on"></i><i class="on"></i><i></i></div>
  <div class="body">
    <div class="title">정리만 하면 끝이에요</div>
    <div class="desc">미뤄둔 영상만 빠르게 다듬고, 실패 컷은 한 번에 비워요.</div>

    <div class="snap">
      <svg viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M8 6l1.2-2h5.6L16 6"/><circle cx="12" cy="12.5" r="3.4"/></svg>
      오늘의 한 컷 남기기 · 건너뛰기
    </div>

    <div class="lbl"><span>미뤄둔 트리밍</span><span style="color:#EA580C">2개</span></div>
    <div class="q">
      <div class="thumb"><span class="sq" style="background:#60A5FA"></span></div>
      <div><div class="t">파랑 · B벽</div><div class="s">0:19 · 4트 완등</div></div>
      <div class="acts"><span class="cut">자르기</span><span class="orig">원본</span></div>
    </div>
    <div class="q">
      <div class="thumb"><span class="sq" style="background:#F87171"></span></div>
      <div><div class="t">빨강 · A벽</div><div class="s">0:24 · 첫 완등</div></div>
      <div class="acts"><span class="cut">자르기</span><span class="orig">원본</span></div>
    </div>

    <div class="trash">
      <svg viewBox="0 0 24 24" fill="none" stroke="#F87171" stroke-width="2"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>
      <div><div class="t">실패 영상 47개</div><div class="s">아카이빙에는 안 담겨요</div></div>
      <span class="go">모두 삭제</span>
    </div>
  </div>
  <div class="foot">
    <div class="next">리포트 만들기</div>
  </div>
</div></body></html>
