<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2 · 홈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05070d;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px;font-family:'Barlow',system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.phone{width:390px;height:844px;background:#0B0F1A;border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.06)}
.sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600;color:#cbd5e1}
.cnd{font-family:'Barlow Condensed',sans-serif}
.body{flex:1;overflow-y:auto;padding:6px 20px 20px}
.hi{font-size:15px;color:#94A3B8;font-weight:600}
.name{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;margin-top:1px}
.snap{background:linear-gradient(160deg,#0f1830,#141a26);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:18px;margin-top:14px}
.srow{display:flex;align-items:center;gap:18px}
.ring{width:96px;height:96px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;position:relative;
  background:conic-gradient(#5A8FDB 0 78%,rgba(255,255,255,.08) 78% 100%)}
.ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:#141a26}
.ring .in{position:relative;z-index:2;text-align:center}
.ring .lv{font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:800;line-height:.9;color:#5A8FDB}
.ring .lb{font-size:10px;color:#94A3B8;font-weight:700;letter-spacing:.5px}
.sinfo .t{font-size:13px;color:#94A3B8;font-weight:600}
.sinfo .big{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;margin:2px 0 4px;display:flex;align-items:center;gap:8px}
.sinfo .big .sq{width:16px;height:16px;border-radius:5px;background:#5A8FDB}
.sinfo .p{font-size:12px;color:#46AE72;font-weight:600}
.curve{margin-top:16px}
.clab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.clab .t{font-size:12px;color:#64748B;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.clab .v{font-size:12px;color:#94A3B8;font-weight:600}
.chart{height:84px;border-radius:12px;background:#0f1420;position:relative;overflow:hidden;display:flex;align-items:flex-end;gap:3px;padding:8px}
.chart .bar{flex:1;border-radius:3px 3px 0 0;display:flex;flex-direction:column-reverse}
.chart .bar i{display:block;width:100%}
.legend{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:5px;font-size:11px;color:#94A3B8;font-weight:600}
.lg .d{width:9px;height:9px;border-radius:2px}
.mon{font-size:12px;color:#64748B;font-weight:600;margin-top:10px;text-align:center}
.start{height:60px;border-radius:18px;background:#EA580C;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:18px;margin-top:18px;box-shadow:0 12px 30px rgba(234,88,12,.3)}
.start svg{width:24px;height:24px}
.sect{font-size:12px;color:#64748B;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin:22px 4px 10px}
.rep{background:#141A26;border:1px solid rgba(255,255,255,.1);border-radius:20px;overflow:hidden}
.rep .img{height:130px;background:linear-gradient(160deg,#334155,#0f172a);display:flex;align-items:flex-end;padding:16px}
.rep .big{font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:700;line-height:.9}
.rep .meta{font-size:12px;color:#cbd5e1;font-weight:600}
.rep .foot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:12px;color:#94A3B8}
.mini{display:flex;gap:4px}
.mini i{width:16px;height:8px;border-radius:3px;display:block}
.tab{height:66px;flex:none;display:flex;border-top:1px solid rgba(255,255,255,.1);background:rgba(20,26,38,.95);padding-bottom:8px}
.tab a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:#64748B;font-weight:700}
.tab a.on{color:#fff}
.tab svg{width:22px;height:22px}
</style></head>
<body><div class="phone">
  <div class="sb"><span class="cnd">9:41</span><span>▮▮▮ ᯤ 100</span></div>
  <div class="body">
    <div class="hi">오늘도 붙어볼까요,</div>
    <div class="name">기영 님</div>

    <div class="snap">
      <div class="srow">
        <div class="ring"><div class="in"><div class="lv">5</div><div class="lb">LEVEL</div></div></div>
        <div class="sinfo">
          <div class="t">현재 실력</div>
          <div class="big"><span class="sq"></span>Lv.5 파랑</div>
          <div class="p">Lv.6 남색까지 78%</div>
        </div>
      </div>
      <div class="curve">
        <div class="clab"><span class="t">누적 완등</span><span class="v">총 87</span></div>
        <div class="chart">
          <div class="bar"><i style="height:8px;background:#E45D5D"></i><i style="height:4px;background:#E68A4C"></i></div>
          <div class="bar"><i style="height:12px;background:#E45D5D"></i><i style="height:7px;background:#E68A4C"></i><i style="height:4px;background:#DDBB44"></i></div>
          <div class="bar"><i style="height:15px;background:#E45D5D"></i><i style="height:9px;background:#E68A4C"></i><i style="height:7px;background:#DDBB44"></i></div>
          <div class="bar"><i style="height:18px;background:#E45D5D"></i><i style="height:11px;background:#E68A4C"></i><i style="height:9px;background:#DDBB44"></i><i style="height:5px;background:#46AE72"></i></div>
          <div class="bar"><i style="height:22px;background:#E45D5D"></i><i style="height:13px;background:#E68A4C"></i><i style="height:11px;background:#DDBB44"></i><i style="height:8px;background:#46AE72"></i></div>
          <div class="bar"><i style="height:26px;background:#E45D5D"></i><i style="height:16px;background:#E68A4C"></i><i style="height:13px;background:#DDBB44"></i><i style="height:11px;background:#46AE72"></i><i style="height:6px;background:#5A8FDB"></i></div>
        </div>
        <div class="mon">이번 달 4회 방문 · Lv.5 파랑 첫 완등</div>
      </div>
    </div>

    <div class="start">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M5 3l16 9-16 9V3z"/></svg>
      클라이밍 시작
    </div>

    <div class="sect">최근 클라이밍</div>
    <div class="rep">
      <div class="img"><div><div class="big cnd">14</div><div class="meta">닻 클라이밍 · 7월 13일</div></div></div>
      <div class="foot"><span>1시간 24분 · 최고 Lv.5 파랑</span>
        <span class="mini"><i style="background:#DDBB44"></i><i style="background:#46AE72"></i><i style="background:#5A8FDB"></i></span>
      </div>
    </div>
  </div>
  <div class="tab">
    <a class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>홈</a>
    <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 9h16M9 4v16"/></svg>기록</a>
  </div>
</div></body></html>
