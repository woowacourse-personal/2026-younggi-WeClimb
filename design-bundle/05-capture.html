<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5 · 촬영 (성공/실패)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05070d;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px;font-family:'Barlow',system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.06);
  background:linear-gradient(180deg,#2a2320 0%,#161a20 45%,#0e1219 100%)}
.wall{position:absolute;inset:0;opacity:.5;background:
  radial-gradient(circle at 30% 30%,#F87171 0 14px,transparent 15px),
  radial-gradient(circle at 62% 22%,#60A5FA 0 12px,transparent 13px),
  radial-gradient(circle at 44% 52%,#FACC15 0 13px,transparent 14px),
  radial-gradient(circle at 72% 62%,#F87171 0 12px,transparent 13px),
  radial-gradient(circle at 30% 74%,#22C55E 0 13px,transparent 14px),
  radial-gradient(circle at 58% 82%,#60A5FA 0 12px,transparent 13px)}
.sb{position:relative;z-index:3;height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600;color:#fff}
.cnd{font-family:'Barlow Condensed',sans-serif}
.hdr{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:6px 20px}
.selc{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:7px 14px;font-weight:700;font-size:14px}
.selc .sq{width:16px;height:16px;border-radius:5px;background:#60A5FA}
.rec{display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.45);border-radius:20px;padding:7px 12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px}
.rec .d{width:9px;height:9px;border-radius:50%;background:#EF4444;box-shadow:0 0 0 0 rgba(239,68,68,.6)}
.mid{flex:1}
.result{position:relative;z-index:3;padding:0 18px 30px}
.q{text-align:center;font-weight:700;font-size:18px;margin-bottom:16px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.btns{display:flex;gap:12px}
.big{flex:1;height:96px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:20px;border:none}
.ok{background:#059669;color:#fff}
.no{background:#DC2626;color:#fff}
.big svg{width:30px;height:30px}
.big small{font-weight:600;font-size:12px;opacity:.85}
.shutter{position:relative;z-index:3;display:flex;justify-content:center;padding-bottom:28px}
.sh{width:74px;height:74px;border-radius:50%;border:5px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center}
.sh i{width:30px;height:30px;border-radius:8px;background:#EF4444;display:block}
.hint{position:relative;z-index:3;text-align:center;color:rgba(255,255,255,.7);font-size:12px;padding-bottom:6px}
</style></head>
<body><div class="phone">
  <div class="wall"></div>
  <div class="sb"><span class="cnd">9:41</span><span>▮▮▮ ᯤ 100</span></div>
  <div class="hdr">
    <div class="selc"><span class="sq"></span>파랑 · B벽</div>
    <div class="rec"><span class="d"></span>0:08</div>
  </div>
  <div class="mid"></div>
  <div class="result">
    <div class="q">방금 시도, 성공했나요?</div>
    <div class="btns">
      <button class="big no">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>
        실패<small>삭제 대기함으로</small>
      </button>
      <button class="big ok">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M5 13l4 4L19 7"/></svg>
        성공<small>트리밍하기</small>
      </button>
    </div>
  </div>
</div></body></html>
