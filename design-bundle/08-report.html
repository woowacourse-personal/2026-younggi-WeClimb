<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8 · 리포트 (앱의 얼굴)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05070d;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px;font-family:'Barlow',system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.phone{width:390px;height:844px;background:#0B0F1A;border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.06)}
.sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600;color:#cbd5e1;z-index:5}
.cnd{font-family:'Barlow Condensed',sans-serif}
.scroll{flex:1;overflow-y:auto;padding:8px 18px 16px}
/* shareable card 9:16 */
.card{border-radius:26px;overflow:hidden;position:relative;background:linear-gradient(180deg,#3f2a1a 0%,#1b1c28 46%,#0b0f1a 100%);min-height:560px;display:flex;flex-direction:column;justify-content:space-between;padding:22px;border:1px solid rgba(255,255,255,.08)}
.card::before{content:"";position:absolute;inset:0;opacity:.35;background:
  radial-gradient(circle at 78% 16%,#F87171 0 10px,transparent 11px),
  radial-gradient(circle at 88% 30%,#60A5FA 0 8px,transparent 9px),
  radial-gradient(circle at 70% 40%,#FACC15 0 9px,transparent 10px)}
.ctop{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-start}
.gymname{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700}
.date{color:#cbd5e1;font-size:13px;font-weight:600;margin-top:2px}
.brand{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:.5px;opacity:.9}
.brand b{color:#EA580C}
.hero{position:relative;z-index:2;text-align:left}
.heronum{font-family:'Barlow Condensed',sans-serif;font-size:110px;font-weight:800;line-height:.82;letter-spacing:-1px}
.herolab{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:600;color:#EA580C;margin-top:-4px}
.stats{position:relative;z-index:2;display:flex;gap:20px;margin-top:16px}
.stat .v{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1}
.stat .k{font-size:11px;color:#94A3B8;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.dist{position:relative;z-index:2;margin-top:18px}
.distbar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
.distbar i{display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:10px}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:#cbd5e1;font-weight:600}
.lg .d{width:10px;height:10px;border-radius:3px}
/* thumbnails */
.strip{display:flex;gap:8px;margin-top:16px}
.strip .tn{flex:1;aspect-ratio:.72;border-radius:12px;background:linear-gradient(160deg,#3a3330,#161a20);position:relative;overflow:hidden}
.strip .tn .sq{position:absolute;top:6px;left:6px;width:12px;height:12px;border-radius:4px}
.strip .tn .pl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.strip .tn .pl svg{width:20px;height:20px;opacity:.85}
/* actions */
.acts{padding:14px 2px 6px;display:flex;gap:12px}
.b{flex:1;height:54px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;border:none}
.insta{background:#EA580C;color:#fff}
.save{background:#1E2634;color:#fff;flex:0 0 54px}
.save svg{width:22px;height:22px}
.insta svg{width:20px;height:20px}
</style></head>
<body><div class="phone">
  <div class="sb"><span class="cnd">9:41</span><span>▮▮▮ ᯤ 100</span></div>
  <div class="scroll">
    <div class="card">
      <div class="ctop">
        <div><div class="gymname">닻 클라이밍</div><div class="date">2026. 7. 15 · 1시간 24분</div></div>
        <div class="brand">✦ WE-<b>CLIMB</b></div>
      </div>
      <div class="hero">
        <div class="heronum">14</div>
        <div class="herolab">완등</div>
      </div>
      <div class="stats">
        <div class="stat"><div class="v" style="display:flex;align-items:center;gap:7px"><span style="width:16px;height:16px;border-radius:5px;background:#3B82F6;display:inline-block"></span>파랑</div><div class="k">최고 난이도</div></div>
        <div class="stat"><div class="v">1:24</div><div class="k">운동 시간</div></div>
      </div>
      <div style="position:relative;z-index:2;margin-top:18px;display:flex;flex-direction:column;gap:9px">
        <div style="display:flex;align-items:center;gap:9px"><span style="width:14px;height:14px;border-radius:4px;background:#FACC15;flex:none"></span><span style="width:34px;font-size:13px;font-weight:600">노랑</span><span style="flex:1;height:9px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden"><i style="display:block;height:100%;width:60%;background:#FACC15;border-radius:5px"></i></span><span class="cnd" style="width:22px;text-align:right;font-weight:700;font-size:15px">3</span></div>
        <div style="display:flex;align-items:center;gap:9px"><span style="width:14px;height:14px;border-radius:4px;background:#22C55E;flex:none"></span><span style="width:34px;font-size:13px;font-weight:600">초록</span><span style="flex:1;height:9px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden"><i style="display:block;height:100%;width:100%;background:#22C55E;border-radius:5px"></i></span><span class="cnd" style="width:22px;text-align:right;font-weight:700;font-size:15px">5</span></div>
        <div style="display:flex;align-items:center;gap:9px"><span style="width:14px;height:14px;border-radius:4px;background:#3B82F6;flex:none"></span><span style="width:34px;font-size:13px;font-weight:600">파랑</span><span style="flex:1;height:9px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden"><i style="display:block;height:100%;width:80%;background:#3B82F6;border-radius:5px"></i></span><span class="cnd" style="width:22px;text-align:right;font-weight:700;font-size:15px">4</span></div>
        <div style="display:flex;align-items:center;gap:9px"><span style="width:14px;height:14px;border-radius:4px;background:#EF4444;flex:none"></span><span style="width:34px;font-size:13px;font-weight:600">빨강</span><span style="flex:1;height:9px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden"><i style="display:block;height:100%;width:40%;background:#EF4444;border-radius:5px"></i></span><span class="cnd" style="width:22px;text-align:right;font-weight:700;font-size:15px">2</span></div>
      </div>
    </div>
    <div class="acts">
      <button class="b insta">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="#fff"/></svg>
        인스타 스토리로 공유
      </button>
      <button class="b save">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
      </button>
    </div>
  </div>
</div></body></html>
